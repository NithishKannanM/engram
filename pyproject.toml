[project]
name = "engram"
version = "0.1.0"
description = "Engram — a local-first hybrid graph+vector memory service (Phase 1)"
readme = "README.md"
authors = [
    { name = "NithishKannanM", email = "nithishkannanm1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cognee[anthropic,ollama,postgres-binary]>=1.4.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.30",
    "faiss-cpu>=1.14.3",
    "rank-bm25>=0.2",
    "rapidfuzz>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Explicit, not transitive. These all arrive via cognee today, which means a
    # cognee bump could silently remove a dependency this service builds on.
    "litellm>=1.83.7",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "filetype>=1.2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

# The distribution is "engram"; the import namespace stays `local_infra` (the name
# every module and test uses). Override the module name so the build backend does not
# expect a `src/engram/` package.
[tool.uv.build-backend]
module-name = "local_infra"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
